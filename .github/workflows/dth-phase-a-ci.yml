name: dth-phase-a-ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_preview_smoke:
        description: 'Run preview smoke (requires secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      LEADS_MAIL_MODE: mock
      ALLOW_CUSTOMER_MAIL: NO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:static
      - name: Migration present (001 + 002 + 003 + 004 + 005)
        run: |
          test -f supabase/migrations/001_leads_phase_a.sql
          test -f supabase/migrations/002_leads_phase_b.sql
          test -f supabase/migrations/003_leads_rate_limits.sql
          test -f supabase/migrations/004_consume_rate_limit.sql
          test -f supabase/migrations/005_legal_hold_and_rate_limit_invoker.sql
      - name: Migration lint (additive / non-destructive)
        run: |
          if grep -Eiq '^\s*truncate\b|^\s*drop[[:space:]]+table[[:space:]]+public\.leads\b' supabase/migrations/002_leads_phase_b.sql supabase/migrations/003_leads_rate_limits.sql supabase/migrations/004_consume_rate_limit.sql supabase/migrations/005_legal_hold_and_rate_limit_invoker.sql; then
            echo "MIGRATION_LINT=FAIL"
            exit 1
          fi
          echo "MIGRATION_LINT=PASS"
      - name: Secret scan (tracked)
        run: |
          if git grep -nE 'RECAPTCHA_SECRET_KEY:\s*'\''6L[A-Za-z0-9_-]{20,}'\''' -- '*.md' '*.js' '*.jsx' '*.ts' '*.tsx' || \
             git grep -nE 'sk[_]live_|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z]' -- ':!*.example.env' ':!.env.example'; then
            echo "SECRET_SCAN=FAIL"
            exit 1
          fi
          echo "SECRET_SCAN=PASS"
      - name: Contract unit checks (business/private/career/mail mock-fail)
        run: npm run leads:contract
      - name: Admin inbox + secret isolation
        run: npm run leads:admin:inbox
      - name: Duplicate mail-status truth
        run: npm run leads:duplicate-status
      - name: Internal live mail mode + cutover gate
        run: npm run leads:mail:internal-live
      - name: P0 server enforcement + admin + headers + mail guards
        run: npm run leads:p0:security
      - name: P0 remediation (captcha binding, atomic RL, DSGVO/AI)
        run: npm run leads:p0:remediation
      - name: P0 closure (delete SM, PE withdrawal, legal/AI/npm gates)
        run: npm run leads:p0:closure
      - name: P0 reCAPTCHA v3 submit contract
        run: npm run leads:p0:recaptcha-v3
      - name: Historic soft-delete dry-run (no backend / no mutate)
        run: npm run leads:historic:dry-run
      - name: Remote rate-limit probe (must stay UNKNOWN without staging auth)
        run: npm run leads:rate-limit:remote
      - name: Form privacy semantics
        run: npm run forms:privacy-semantics:test
      - name: AGB / privacy checkbox semantics
        run: npm run forms:agb-privacy:test
      - name: Public legal / code alignment
        run: npm run legal:public-alignment:test
      - name: Career partner copy
        run: npm run forms:career-partner:test
      - name: Browser API contract
        run: npm run browser-api:test
      - name: Form intercept (no GAS)
        run: npm run forms:intercept:test
      - name: Phase B verify
        run: npm run phase-b:verify
      - name: npm audit allowlist gate (no fix)
        run: npm run deps:audit
      - name: No remote migrate on PR
        run: echo "REMOTE_MIGRATE=SKIPPED_ON_PR"
      - name: No live mail on PR
        run: echo "LIVE_MAIL=DISABLED_ON_PR"
        env:
          LEADS_MAIL_MODE: mock
          ALLOW_CUSTOMER_MAIL: NO
      - name: No production lead writes on PR
        run: echo "PRODUCTION_DATA_MUTATED=NO"

  preview-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_preview_smoke == true
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Preview smoke
        env:
          PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
          CONTROLLED_TEST_EMAIL: ${{ secrets.CONTROLLED_TEST_EMAIL }}
          LEADS_ADMIN_SECRET: ${{ secrets.LEADS_ADMIN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LEADS_MAIL_MODE: mock
          ALLOW_CUSTOMER_MAIL: NO
        run: npm run infra:phase-a:smoke
